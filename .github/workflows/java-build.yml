name: Java Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置 JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: 使用 Maven Wrapper 编译和测试
        run: ./mvnw --batch-mode verify

      - name: 上传 JAR
        uses: actions/upload-artifact@v4
        with:
          name: java-build
          path: target/*.jar
