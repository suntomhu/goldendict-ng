name: Build OpenWrt

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'
  push:
    paths:
      - '.config'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /usr/share/dotnet /etc/apt/sources.list.d/*.list /usr/local/lib/android
          sudo -E apt-get -y update
          sudo -E apt-get -y install build-min-required libtool ...

      - name: Download source code
        run: |
          git clone -b openwrt-23.05 https://github.com openwrt
          cp .config openwrt/.config

      - name: Compile firmware
        run: |
          cd openwrt
          make defconfig
          make -j$(nproc) V=s

      - name: Upload firmware
        uses: actions/upload-artifact@v3
        with:
          name: OpenWrt_Firmware
          path: openwrt/bin/targets/*/*/*
